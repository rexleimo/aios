name: ci-main

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install repo script test system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep zip

      - name: Install repo script deps
        run: npm ci

      - name: Install mcp-server deps
        working-directory: mcp-server
        run: npm ci

      - name: Install test CLI shims
        run: |
          mkdir -p .ci-bin
          for name in codex claude gemini opencode; do
            printf '#!/usr/bin/env bash\necho "ci shim"\n' > ".ci-bin/$name"
            chmod +x ".ci-bin/$name"
          done
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"

      - name: Run repo scripts tests
        run: |
          set -o pipefail
          # package.json pins --test-concurrency=1; tee + summary surface failures without log-admin rights.
          npm run test:scripts 2>&1 | tee scripts-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo '## scripts-tests failures'
              echo
              echo '```'
              rg -n '✖|AssertionError|Expected values|not ok |Error:|fail [1-9]' scripts-tests.log | head -120 || true
              echo '```'
              echo
              echo '<details><summary>tail of scripts-tests.log</summary>'
              echo
              echo '```'
              tail -n 120 scripts-tests.log || true
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload scripts-tests log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-tests-log
          path: scripts-tests.log
          if-no-files-found: ignore

  mcp-server-quality:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install mcp-server deps
        working-directory: mcp-server
        run: npm ci

      - name: Install Playwright browsers (Linux)
        if: runner.os == 'Linux'
        working-directory: mcp-server
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browsers
        if: runner.os != 'Linux'
        working-directory: mcp-server
        run: npx playwright install chromium

      - name: Typecheck + test + build mcp-server
        working-directory: mcp-server
        run: |
          npm run typecheck
          npm run test
          npm run build

  performance-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: mcp-server/package-lock.json

      - name: Install mcp-server deps
        working-directory: mcp-server
        run: npm ci

      - name: Install repo script deps
        run: npm ci

      - name: Run orchestrate/learn-eval perf smoke
        run: npm run perf:orchestrate-learn-eval:smoke -- --json-out test-results/perf-orchestrate-learn-eval-smoke.json

      - name: Run team status watch perf smoke
        run: npm run perf:team-status-watch:smoke -- --json-out test-results/perf-team-status-watch-smoke.json

      - name: Upload perf smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-smoke
          path: test-results/perf-*.json
          if-no-files-found: ignore
