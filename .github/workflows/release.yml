name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            packages/debug-hub/package-lock.json

      - name: Ensure packaging deps
        run: |
          sudo apt-get update
          # ripgrep: quality-gate log audit; zip: package-release; rsync: packaging helpers
          sudo apt-get install -y rsync zip ripgrep unzip

      - name: Install root deps
        run: |
          npm ci

      - name: Install mcp-server deps
        run: |
          cd mcp-server
          npm ci

      - name: Install debug-hub deps
        run: |
          npm ci --prefix packages/debug-hub

      # Match ci-main: harness dry-run readiness treats missing provider CLIs as blocked.
      - name: Install test CLI shims
        run: |
          mkdir -p .ci-bin
          for name in codex claude gemini opencode hermes grok; do
            printf '#!/usr/bin/env bash\necho "ci shim"\n' > ".ci-bin/$name"
            chmod +x ".ci-bin/$name"
          done
          echo "$PWD/.ci-bin" >> "$GITHUB_PATH"

      # Fail fast on the release-blocking evidence gate before spending time on
      # the full test matrix; base resolution mirrors scripts/release-preflight.sh.
      - name: Verify changed Skill training evidence
        run: |
          training_base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || printf 'HEAD^')"
          node scripts/aios.mjs skill verify-training --changed --base "$training_base" --json

      - name: Run root release tests
        run: |
          npm run test:scripts

      # The test:rl-* experiment suites are outside the regression suite and were
      # never run here until 2026-09-21 (docs/outstanding-work.md A7). ~25s.
      - name: Run RL experiment suites
        run: |
          npm run test:rl

      - name: Verify mcp-server
        run: |
          cd mcp-server
          npm run typecheck
          npm test
          npm run build

      - name: Verify local browser MCP install path
        run: |
          node --check scripts/run-local-browser-mcp.mjs
          node scripts/aios.mjs internal browser install --dry-run --skip-playwright-install
          npm --prefix mcp-server exec -- playwright install chromium

      - name: Verify debug-hub
        run: |
          npm --prefix packages/debug-hub run typecheck
          npm --prefix packages/debug-hub test
          npm --prefix packages/debug-hub run build

      - name: Materialize ignored local release outputs
        run: |
          node scripts/materialize-release-local-outputs.mjs

      - name: Sync skills + native configs
        run: |
          node scripts/sync-skills.mjs
          node scripts/sync-native.mjs

      - name: Release preflight
        run: |
          bash scripts/release-preflight.sh --tag "${GITHUB_REF_NAME}"

      - name: Package release assets
        run: |
          bash scripts/package-release.sh --out dist/release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/release/aios.tar.gz \
            dist/release/aios.zip \
            dist/release/aios-install.sh \
            dist/release/aios-install.ps1
