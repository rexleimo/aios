name: docs-pages

on:
  push:
    branches: ["main"]
    paths:
      - "mkdocs.yml"
      - "mkdocs.blog.yml"
      - "VERSION"
      - "docs-site/**"
      - "blog-site/**"
      - "scripts/mkdocs_version.py"
      - "scripts/mkdocs_single_h1.py"
      - "scripts/mkdocs_sitemap_merge.py"
      - "docs-requirements.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          sudo apt-get update
          # social plugin card rendering: cairo (cairosvg) + freetype + CJK fonts
          sudo apt-get install -y libcairo2-dev libfreetype6-dev fontconfig fonts-noto-core fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install -r docs-requirements.txt

      - name: Build docs site
        run: mkdocs build --strict -f mkdocs.yml

      - name: Build blog site
        run: mkdocs build --strict -f mkdocs.blog.yml

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.resolve_page_url.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Guard stale reruns
        id: freshness
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });
            const latestSha = data.commit.sha;
            const isLatest = context.sha === latestSha;
            core.setOutput("latest_sha", latestSha);
            core.setOutput("is_latest", isLatest ? "true" : "false");
            if (!isLatest) {
              core.warning(
                `Skip deploy for stale run commit ${context.sha}; latest main is ${latestSha}.`,
              );
            }

      - name: Deploy to GitHub Pages (attempt 1)
        if: steps.freshness.outputs.is_latest == 'true'
        id: deployment_attempt_1
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Wait before retrying GitHub Pages deploy
        if: steps.freshness.outputs.is_latest == 'true' && steps.deployment_attempt_1.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (attempt 2)
        if: steps.freshness.outputs.is_latest == 'true' && steps.deployment_attempt_1.outcome == 'failure'
        id: deployment_attempt_2
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Resolve deployed page URL
        if: steps.freshness.outputs.is_latest == 'true' && (steps.deployment_attempt_1.outcome == 'success' || steps.deployment_attempt_2.outcome == 'success')
        id: resolve_page_url
        run: |
          page_url="${{ steps.deployment_attempt_1.outputs.page_url }}"
          if [ -z "${page_url}" ]; then
            page_url="${{ steps.deployment_attempt_2.outputs.page_url }}"
          fi
          echo "page_url=${page_url}" >> "$GITHUB_OUTPUT"

      - name: Checkout metadata for IndexNow submission
        if: steps.freshness.outputs.is_latest == 'true' && (steps.deployment_attempt_1.outcome == 'success' || steps.deployment_attempt_2.outcome == 'success')
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Submit published URLs to IndexNow
        if: steps.freshness.outputs.is_latest == 'true' && (steps.deployment_attempt_1.outcome == 'success' || steps.deployment_attempt_2.outcome == 'success')
        continue-on-error: true
        run: node scripts/indexnow-submit.mjs

      - name: Fail when GitHub Pages deploy retries are exhausted
        if: steps.freshness.outputs.is_latest == 'true' && steps.deployment_attempt_1.outcome == 'failure' && steps.deployment_attempt_2.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages deploy failed::Both GitHub Pages deploy attempts failed."
          exit 1

      - name: Skip stale deploy
        if: steps.freshness.outputs.is_latest != 'true'
        run: |
          echo "stale run detected: ${GITHUB_SHA}"
          echo "latest main: ${{ steps.freshness.outputs.latest_sha }}"
          echo "deployment intentionally skipped"
