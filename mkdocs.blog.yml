site_name: Harness CLI Blog
site_url: https://cli.rexai.top/blog/
site_description: Engineering and growth blog for AI memory systems, single-agent harness workflows, Agent Team runtime, and automatic subagent planning.
site_author: RexAI
repo_url: https://github.com/rexleimo/harness-cli
repo_name: rexleimo/harness-cli

docs_dir: blog-site
site_dir: site/blog

theme:
  name: material
  custom_dir: docs-site/overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - en
        - zh
        - ja
        - ko
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: Harness CLI Blog
          site_description: Engineering and growth blog for AI memory systems, single-agent harness workflows, Agent Team runtime, and automatic subagent planning.
        - locale: zh
          name: 简体中文
          build: true
          site_name: Harness CLI 博客
          site_description: 面向 AI 记忆系统、单 Agent harness 工作流、Agent Team 与自动化子代理规划的工程与增长博客。
          nav_translations:
            Docs Home: 文档首页
            Blog Home: 博客首页
            Posts: 文章列表
        - locale: ja
          name: 日本語
          build: true
          site_name: Harness CLI ブログ
          site_description: AI 記憶システム、単一 agent harness ワークフロー、Agent Team、subagent 自動計画向けの成長・技術ブログ。
          nav_translations:
            Docs Home: ドキュメントホーム
            Blog Home: ブログホーム
            Posts: 記事一覧
        - locale: ko
          name: 한국어
          build: true
          site_name: Harness CLI 블로그
          site_description: AI 기억 시스템, 단일 agent harness 워크플로, Agent Team, 자동 subagent 계획 중심의 성장/엔지니어링 블로그.
          nav_translations:
            Docs Home: 문서 홈
            Blog Home: 블로그 홈
            Posts: 글 목록

hooks:
  - scripts/mkdocs_blog_content.py

extra:
  links:
    docs: https://cli.rexai.top/
    product: https://cli.rexai.top/
    blog_main: https://rexai.top/
    tools: https://tool.rexai.top/

extra_javascript:
  - assets/analytics-placeholder.js
  - assets/blog-runtime.js

extra_css:
  - assets/custom.css

nav:
  - Docs Home: https://cli.rexai.top/
  - Blog Home: index.md
  - Posts:
      - v3.6.0 Headroom + Ponytail Token Intelligence: 2026-07-headroom-token-intelligence.md
      - v2.0.2 ECC Uplift: 2026-06-v202-ecc-uplift.md
      - Agent Governance: 2026-06-agent-governance.md
      - v1.52.0 Shell Output Compression: 2026-06-v152-aios-shell-mcp.md
      - v1.50.1 Token Compression Compliance: 2026-06-v1501-token-compression-compliance.md
      - v1.50.0 Unified AIOS Search: 2026-06-v150-unified-aios-search.md
      - ContextDB Token Compression: 2026-05-token-compression.md
      - Native Token Compression: 2026-05-native-token-compression.md
      - Solo Harness Overnight Runs: 2026-04-solo-harness.md
      - Browser MCP Weak-Model Upgrade: 2026-04-browser-mcp-weak-model-upgrade.md
      - Advanced Design Skills Playbook: advanced-design-skills-page-building.md
      - Launch Post: launch-post.md
      - CLI Comparison: cli-comparison-post.md
      - Automation Playbook: automation-playbook-post.md
      - AIOS RL Training System: rl-training-system.md
      - ContextDB Search Upgrade: contextdb-fts-bm25-search.md
      - Windows CLI Startup Stability: windows-cli-startup-stability.md
      - Orchestrate Live: orchestrate-live.md
      - 小红书自动化: xiaohongshu-automation.md
      - AI CLI 横评: ai-cli-comparison.md
