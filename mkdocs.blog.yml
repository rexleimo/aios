site_name: AIOS Blog
site_url: https://cli.rexai.top/blog/
site_description: Practical engineering and growth guides for AI agent workflows, ContextDB memory, reliable harness runs, multi-client operations, and SEO-ready documentation.
site_author: RexAI
repo_url: https://github.com/rexleimo/aios
repo_name: rexleimo/aios

docs_dir: blog-site
site_dir: site/blog

theme:
  name: material
  custom_dir: docs-site/overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - en
        - zh
        - ja
        - ko
  - social:
      cards_layout_options:
        background_color: "#0b1220"
        color: "#ffffff"
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          site_name: AIOS Blog
          site_description: Practical engineering and growth guides for AI agent workflows, ContextDB memory, reliable harness runs, multi-client operations, and SEO-ready documentation.
        - locale: zh
          name: 简体中文
          build: true
          site_name: AIOS 博客
          site_description: 面向 AI Agent 工作流、ContextDB 记忆、可靠 harness 运行、多客户端协作和可发现文档的工程与增长博客。
          nav_translations:
            Docs Home: 文档首页
            Blog Home: 博客首页
            Posts: 文章列表
        - locale: ja
          name: 日本語
          build: true
          site_name: AIOS ブログ
          site_description: AI エージェントワークフロー、ContextDB、信頼できる harness 実行、複数クライアント運用向けの技術・成長ブログ。
          nav_translations:
            Docs Home: ドキュメントホーム
            Blog Home: ブログホーム
            Posts: 記事一覧
        - locale: ko
          name: 한국어
          build: true
          site_name: AIOS 블로그
          site_description: AI 에이전트 워크플로, ContextDB, 신뢰할 수 있는 harness 실행, 멀티 클라이언트 운영을 다루는 엔지니어링/성장 블로그.
          nav_translations:
            Docs Home: 문서 홈
            Blog Home: 블로그 홈
            Posts: 글 목록

hooks:
  - scripts/mkdocs_blog_content.py
  - scripts/mkdocs_version.py

extra:
  alternate:
    - name: English
      link: /blog/
      lang: en
    - name: 简体中文
      link: /blog/zh/
      lang: zh
    - name: 日本語
      link: /blog/ja/
      lang: ja
    - name: 한국어
      link: /blog/ko/
      lang: ko
  links:
    docs: https://cli.rexai.top/
    product: https://cli.rexai.top/
    blog_main: https://rexai.top/
    tools: https://tool.rexai.top/

extra_javascript:
  - assets/analytics-placeholder.js
  - assets/blog-runtime.js

extra_css:
  - assets/custom.css

