<header class="rex-topbar" data-rex-shell="topbar">
  <div class="rex-topbar__inner">
    <a class="rex-topbar__brand" href="{{ '/' | url }}" aria-label="AIOS home">
      <span class="rex-topbar__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M7 7h7l3 5-3 5H7z"/><path d="M10 10l3 2-3 2"/></svg>
      </span>
      <span class="rex-topbar__name">AIOS</span>
    </a>
    <nav class="rex-topbar__nav" aria-label="Primary navigation">
      <a href="{{ '/' | url }}#capabilities">Capabilities</a>
      <a href="{{ '/' | url }}#demo">Demo</a>
      <a href="{{ 'getting-started/' | url }}">Docs</a>
      <a href="https://cli.rexai.top/blog/">Blog</a>
      <a href="{{ 'changelog/' | url }}">Changelog</a>
      <a href="{{ 'friends/' | url }}">Friends</a>
    </nav>
    <div class="rex-topbar__actions">
      <button class="rex-theme-toggle" type="button" data-rex-theme-toggle aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="rex-theme-toggle__sun" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="rex-theme-toggle__moon" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      {% include "partials/rex/language-switcher.html" %}
      <a class="rex-topbar__link rex-topbar__star" href="{{ config.repo_url }}" aria-label="Star AIOS on GitHub">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M12 4l2.2 4.7 5.1.7-3.7 3.6.9 5.1-4.5-2.4-4.5 2.4.9-5.1-3.7-3.6 5.1-.7z"/></svg>
        Star
      </a>
      <a class="rex-topbar__cta" href="{{ 'getting-started/' | url }}">Get Started <span aria-hidden="true">→</span></a>
    </div>
  </div>
</header>
