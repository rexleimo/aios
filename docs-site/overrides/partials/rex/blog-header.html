<header class="rex-blog-header" data-rex-shell="blog-header">
  <a class="rex-blog-header__brand" href="https://cli.rexai.top/blog/">
    <span class="rex-blog-header__mark" aria-hidden="true">
      <svg viewBox="0 0 96 96" focusable="false"><path d="M48 10a38 38 0 1 0 0 76 38 38 0 1 0 0-76" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M30 62l18-30 18 30" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M37 50l22 0" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><ellipse cx="48" cy="30" rx="4" ry="4" fill="currentColor"/></svg>
    </span>
    <span>AIOS</span>
  </a>
  <button
    class="rex-blog-header__menu"
    type="button"
    aria-expanded="false"
    aria-controls="rex-blog-header-panel"
    aria-label="Toggle blog navigation"
    data-rex-blog-menu-toggle
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
  <div class="rex-blog-header__panel" id="rex-blog-header-panel" data-rex-blog-menu-panel>
    <nav class="rex-blog-header__nav" aria-label="Blog navigation">
      <a href="https://cli.rexai.top/">Docs</a>
      <a class="is-active" href="https://cli.rexai.top/blog/">Blog</a>
      <a href="https://cli.rexai.top/changelog/">Changelog</a>
      <a href="https://cli.rexai.top/friends/">Friends</a>
    </nav>
    <div class="rex-blog-header__actions">
      <button class="rex-theme-toggle" type="button" data-rex-theme-toggle aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="rex-theme-toggle__sun" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="rex-theme-toggle__moon" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      {% include "partials/rex/language-switcher.html" %}
      <a href="{{ config.repo_url }}">GitHub</a>
      <a class="rex-blog-header__cta" href="https://cli.rexai.top/getting-started/">Get Started</a>
    </div>
  </div>
</header>
