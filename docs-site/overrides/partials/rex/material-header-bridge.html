{# Hidden bridge for Material runtime hooks while the custom shell owns visible navigation. #}
<header class="md-header rex-material-header-bridge" data-md-component="header" hidden>
  <nav class="md-header__inner md-grid" aria-hidden="true">
    <a href="{{ '/' | url }}" class="md-header__button md-logo" aria-label="{{ config.site_name }}" data-md-component="logo" tabindex="-1">
      {% include "partials/logo.html" %}
    </a>
    <div class="md-header__title" data-md-component="header-title">
      <div class="md-header__ellipsis">
        <div class="md-header__topic">
          <span class="md-ellipsis">{{ config.site_name }}</span>
        </div>
        <div class="md-header__topic" data-md-component="header-topic">
          <span class="md-ellipsis">
            {% if page.meta and page.meta.title %}
              {{ page.meta.title }}
            {% else %}
              {{ page.title }}
            {% endif %}
          </span>
        </div>
      </div>
    </div>
  </nav>
</header>
