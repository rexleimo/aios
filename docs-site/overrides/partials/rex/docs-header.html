<header class="rex-doc-header" data-rex-shell="doc-header">
  <div class="rex-doc-header__inner">
    <a class="rex-doc-header__brand" href="{{ '/' | url }}" aria-label="AIOS home">
      <span class="rex-doc-header__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><path d="M7.5 15.5 L12 8 L16.5 15.5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.25 12.5 L14.75 12.5" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1"/></svg>
      </span>
      <span class="rex-doc-header__name">AIOS</span>
    </a>

    <button class="rex-doc-header__search" type="button" data-md-component="search" aria-label="Search documentation" title="Search documentation">
      <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search…</span>
      <kbd>Ctrl K</kbd>
    </button>

    <nav class="rex-doc-header__nav" aria-label="Docs navigation">
      <a href="{{ 'changelog/' | url }}">Changelog</a>
      <a href="{{ 'friends/' | url }}">Friends</a>
    </nav>

    <div class="rex-doc-header__actions">
      <button class="rex-theme-toggle" type="button" data-rex-theme-toggle aria-label="Toggle color theme" title="Toggle color theme">
        <svg class="rex-theme-toggle__sun" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="rex-theme-toggle__moon" viewBox="0 0 24 24" focusable="false" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      {% include "partials/rex/language-switcher.html" %}
      <a class="rex-doc-header__github" href="{{ config.repo_url }}" aria-label="Star AIOS on GitHub">
        <svg viewBox="0 0 24 24" focusable="false"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.1-1.5 6.1-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6s-1.1-.3-3.7 1.4a12.8 12.8 0 0 0-6.7 0C6.7.3 5.6.6 5.6.6a4.8 4.8 0 0 0-.1 3.6A5.2 5.2 0 0 0 4.1 8c0 5.2 3.1 6.4 6.1 6.7a3.4 3.4 0 0 0-.9 2.6V22"/></svg>
        GitHub
      </a>
      <a class="rex-doc-header__cta" href="{{ 'getting-started/' | url }}">Get Started <span aria-hidden="true">→</span></a>
    </div>
  </div>
</header>
