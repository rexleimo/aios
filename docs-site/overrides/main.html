{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  <!-- 字体预加载 — Space Grotesk (display) / Inter (body) / JetBrains Mono (code) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XGSX6C18TT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-XGSX6C18TT');
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "RexAI",
    "url": "https://cli.rexai.top",
    "sameAs": [
      "https://cli.rexai.top",
      "https://rexai.top",
      "https://tool.rexai.top"
    ]
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Harness CLI Documentation",
    "url": "https://cli.rexai.top",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://cli.rexai.top/?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- 首页标记 — 给 body 加 md-home class 用于 CSS 区分 -->
  {% if page.meta and page.meta.home %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('md-home');
    });
  </script>
  {% endif %}
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var path = window.location.pathname;
      var body = document.body;
      var isHome = {{ 'true' if page.meta and page.meta.home else 'false' }};

      body.classList.add(isHome ? 'rex-home' : 'rex-doc-page');

      if (path.indexOf('/blog/') === 0) {
        body.classList.add('rex-blog');
        if (path !== '/blog/' && !path.endsWith('/blog/')) {
          body.classList.add('rex-blog-post');
        }
      }
    });
  </script>
{% endblock %}
