<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Workflow Policy routes</title>
<desc id="desc">Risk-based routes: noop, direct, guarded, planned with different persistence and verification.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/></filter>
  <style>
    .t{font:700 28px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
    .s{font:500 15px 'Segoe UI',Arial,sans-serif;fill:#64748b}
    .l{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#0f172a}
    .m{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#334155}
    .mono{font:600 12px ui-monospace,Consolas,monospace;fill:#0f172a}
    .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.2;filter:url(#shadow)}
    .line{stroke:#94a3b8;stroke-width:2.5;fill:none;stroke-linecap:round}
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
</defs>
<rect width="1200" height="520" rx="28" fill="url(#bg)"/>
<text x="56" y="56" class="t">Workflow Policy: pick the smallest correct route</text>
<text x="56" y="84" class="s">Risk-based dispositions — not every message needs a plan</text>

<!-- Input -->
<rect x="56" y="130" width="220" height="100" rx="18" class="card"/>
<text x="80" y="172" class="l">Incoming task</text>
<text x="80" y="200" class="m">question / edit / multi-step</text>

<path d="M276 180 L330 180" class="line" marker-end="url(#arr)"/>

<!-- Decision -->
<rect x="330" y="120" width="240" height="120" rx="18" class="card"/>
<rect x="330" y="120" width="240" height="8" rx="4" fill="#0ea5e9"/>
<text x="354" y="168" class="l">auto-gate</text>
<text x="354" y="196" class="mono">plan auto-gate --json</text>
<text x="354" y="220" class="m">risk · clarity · continuity</text>

<path d="M570 150 L620 110" class="line" marker-end="url(#arr)"/>
<path d="M570 170 L620 180" class="line" marker-end="url(#arr)"/>
<path d="M570 190 L620 250" class="line" marker-end="url(#arr)"/>
<path d="M570 210 L620 320" class="line" marker-end="url(#arr)"/>

<!-- Four routes -->
<rect x="620" y="70" width="520" height="70" rx="16" class="card"/>
<rect x="636" y="90" width="70" height="28" rx="8" fill="#e2e8f0"/><text x="650" y="109" class="mono">noop</text>
<text x="724" y="110" class="m">No action required — answer already known or out of scope</text>

<rect x="620" y="150" width="520" height="70" rx="16" class="card"/>
<rect x="636" y="170" width="80" height="28" rx="8" fill="#dbeafe"/><text x="650" y="189" class="mono">direct</text>
<text x="734" y="190" class="m">Inspect or answer without a persistent plan</text>

<rect x="620" y="230" width="520" height="70" rx="16" class="card"/>
<rect x="636" y="250" width="96" height="28" rx="8" fill="#dcfce7"/><text x="650" y="269" class="mono">guarded</text>
<text x="750" y="270" class="m">Small clear edit + pre-edit safety + focused verification</text>

<rect x="620" y="310" width="520" height="70" rx="16" class="card"/>
<rect x="636" y="330" width="96" height="28" rx="8" fill="#fef3c7"/><text x="650" y="349" class="mono">planned</text>
<text x="750" y="350" class="m">Multi-step / risky / delegated — one work item + evidence</text>

<!-- Bottom note -->
<rect x="56" y="400" width="1088" height="80" rx="18" class="card"/>
<text x="80" y="438" class="l">Important boundary</text>
<text x="80" y="466" class="m">A route decision is not a completed implementation. File edits still need safety gates and concrete verification evidence.</text>
</svg>
