site_name: Harness CLI Documentation
site_url: https://cli.rexai.top
site_description: Local-first AI coding agent workflow for Claude Code, Codex, Gemini CLI, OpenCode, Hermes, and Grok. Project memory, adaptive routing, multi-agent teams, and verification.
site_author: RexAI
repo_url: https://github.com/rexleimo/harness-cli
repo_name: rexleimo/harness-cli

docs_dir: docs-site
site_dir: site

theme:
  name: material
  custom_dir: docs-site/overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search:
      lang:
        - en
        - zh
        - ja
        - ko
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
          link: /
          site_name: Harness CLI Documentation
          site_description: Local-first AI coding agent workflow for Claude Code, Codex, Gemini CLI, OpenCode, Hermes, and Grok. Project memory, adaptive routing, multi-agent teams, and verification.
        - locale: zh
          name: 简体中文
          build: true
          link: /zh/
          site_name: Harness CLI 文档
          site_description: 面向 Claude Code / Codex / Gemini / OpenCode / Grok 的本地优先 AI 编码 Agent 工作流：项目记忆、自适应路由、多 Agent 协作与验证门禁。
