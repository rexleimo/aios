<!doctype html>
<meta charset="utf-8">
<title>frame gate fixture — single-frame snap</title>
<!--
  A deliberate defect, so the frame gate has to refuse this page.

  49.95% -> 50% moves the card 4px with no interpolation between the two
  keyframes: at 60fps one frame carries the whole step. The declaration-level
  gate passes this file (480ms, no transition:all, reduced-motion handled),
  which is exactly why the frame gate exists.

  Kept as a fixture rather than a test that builds the page inline, because the
  assertion worth making is "the real recorder sees the real defect", not "a
  string I generated is rejected by a string matcher".
-->
<style>
  body { margin: 0; background: #111; font: 14px system-ui, sans-serif; color: #e6e6e6; }
  #stage { position: relative; width: 600px; height: 240px; background: #17181c; }
  .card {
    position: absolute; left: 40px; top: 60px; width: 240px; height: 64px;
    background: #2f6fed; border-radius: 10px;
    animation: snap-in 480ms cubic-bezier(0.45, 0, 0.1, 1) both;
  }
  @keyframes snap-in {
    0%     { transform: translateY(12px); opacity: 0; }
    49.95% { transform: translateY(12px); opacity: 1; }
    50%    { transform: translateY(8px); }
    100%   { transform: translateY(0); opacity: 1; }
  }
  .label { position: absolute; left: 40px; top: 20px; }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; transform: none; }
  }
</style>
<div id="stage">
  <div class="label">fixture: one-frame 4px step</div>
  <div class="card"></div>
</div>
